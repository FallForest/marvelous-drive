# Marvelous Drive — one image plus an updater that can replace it.
#
#   docker compose up -d --build          # local build, tag "marvelous-drive:local"
#
# A published deployment instead sets DRIVE_IMAGE in .env
# (ghcr.io/<owner>/marvelous-drive:0.19.0) and the two services below pull it.
# The updater is what moves that tag forward: see docs/RELEASING.md.
services:
  drive:
    image: ${DRIVE_IMAGE:-marvelous-drive:local}
    build: .
    restart: unless-stopped
    environment:
      PORT: 4400
      HOST: 0.0.0.0
      DRIVE_DATA_DIR: /data
      DRIVE_VERSION: ${DRIVE_VERSION:-}
      DRIVE_MAX_UPLOAD_BYTES: ${DRIVE_MAX_UPLOAD_BYTES:-2147483648}
      # Per-account ceiling in BYTES. 0 means unlimited, which is only safe when
      # the data volume is the only thing on the disk. The client divides by 1024
      # and labels the result GB, so 161061273600 renders as "150 GB" and the same
      # quantity df calls 150 GiB — see docs/DEPLOYMENT.md.
      DRIVE_QUOTA_BYTES: ${DRIVE_QUOTA_BYTES:-0}
      JWT_SECRET: ${JWT_SECRET:-}
      # Self-update. All four empty means "no updates offered", which is the
      # right answer for a local build and harmless in the account menu.
      # The manifest token is only needed for a private repository: the API
      # fetches the same release asset as the agent, and an anonymous fetch of a
      # private asset is a 404.
      DRIVE_UPDATE_MANIFEST_URL: ${DRIVE_UPDATE_MANIFEST_URL:-}
      DRIVE_UPDATE_MANIFEST_TOKEN: ${DRIVE_UPDATE_MANIFEST_TOKEN:-}
      DRIVE_UPDATE_AGENT_URL: ${DRIVE_UPDATE_AGENT_URL:-}
      DRIVE_UPDATE_AGENT_TOKEN: ${DRIVE_UPDATE_AGENT_TOKEN:-}
    ports:
      - "${DRIVE_PORT:-4400}:4400"
    volumes:
      - drive_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4400/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # The only container with the Docker socket. It applies a release manifest and
  # runs scripts/deploy/update.sh; the API merely asks it to.
  updater:
    build:
      context: .
      dockerfile: apps/updater/Dockerfile
    image: marvelous-drive-updater:local
    restart: unless-stopped
    environment:
      UPDATE_AGENT_PORT: 8080
      UPDATE_AGENT_TOKEN: ${DRIVE_UPDATE_AGENT_TOKEN:-}
      UPDATE_MANIFEST_URL: ${DRIVE_UPDATE_MANIFEST_URL:-}
      UPDATE_MANIFEST_TOKEN: ${DRIVE_UPDATE_MANIFEST_TOKEN:-}
      UPDATE_PROJECT_DIR: /workspace
      COMPOSE_FILE: ${COMPOSE_FILE:-docker-compose.yml}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-marvelous-drive}
      # Read-only mount of the drive's volume: the backup step tars it, and the
      # data is not in the project directory (a named volume holds it).
      DRIVE_DATA_DIR: /drive-data
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The compose files and the update scripts, so the agent can run compose
      # on the host's behalf with the same files the stack was started from.
      - ./:/workspace
      - drive_data:/drive-data
    healthcheck:
      # 401 on an unauthenticated call is proof of life: it means the HTTP
      # server is up and the token check is in front of it.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/status').then(r=>process.exit(r.status===401?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  drive_data:
