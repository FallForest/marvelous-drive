name: CI

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install optional image codecs
        run: npm ci --no-audit --no-fund
      # Globs, not directories: Node 24 no longer resolves a bare directory
      # argument to the test files inside it ("Cannot find module .../test").
      - name: Server tests
        run: node --test 'apps/server/test/*.test.js'
      - name: CLI tests
        run: node --test 'packages/cli/test/*.test.mjs'
      - name: Web logic tests
        run: node --test 'apps/web/test/*.test.js'
      - name: Script helper tests
        run: node --test 'scripts/test/*.test.mjs'
      - name: Motion lint (static)
        run: node scripts/motion-lint.mjs apps/web/styles
      - name: Syntax check
        run: node scripts/check-syntax.mjs
      # A module nothing imports is dead weight a reviewer cannot see: the import
      # graph is checked here instead of in review.
      - name: Dead code (static)
        run: node scripts/dead-code.mjs --strict
      # A broken compose file only shows up when someone tries to deploy, and
      # the update path depends on the shipped one being valid.
      - name: Compose file is valid
        run: docker compose config --quiet
      - name: Deploy scripts parse
        run: |
          bash -n scripts/deploy/update.sh
          bash -n scripts/deploy/backup.sh

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - name: Browser regression checks with isolated data
        run: |
          export DRIVE_DATA_DIR="$(mktemp -d)"
          node scripts/run-checks.mjs --server http://127.0.0.1:4488 --only browser-check,upload-check,share-check,preview-race-check,ui-regression-check,directory-check,download-check,photo-viewer-check,zoom-check,queue-panel-check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-screenshots
          path: .tmp/shots
          if-no-files-found: ignore

  images:
    # Builds both images on every push so a Dockerfile that only breaks on
    # Linux is caught here, not at release time.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: docker/setup-buildx-action@v3
      - name: Build the drive image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=gha,scope=drive
          cache-to: type=gha,mode=max,scope=drive
      - name: Build the updater image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/updater/Dockerfile
          push: false
          cache-from: type=gha,scope=updater
          cache-to: type=gha,mode=max,scope=updater
